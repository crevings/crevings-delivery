// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath libs.gradle
        classpath libs.google.services
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${project.ext.has('kotlin_version') ? project.ext.kotlin_version : '2.4.10'}"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:${project.ext.has('kotlin_version') ? project.ext.kotlin_version : '2.1.20'}"
        }
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
